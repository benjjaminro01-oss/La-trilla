<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A1918">
  <meta name="description" content="La Trilla — El precio de una decisión. Experiencia narrativa interactiva ambientada en Villa Alegre, Región del Maule, junio de 2018.">
  <title>La Trilla — El precio de una decisión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-bg="inicio">

  <!-- Capas atmosféricas (solo CSS / canvas ligero) -->
  <div id="bg" aria-hidden="true"></div>
  <div id="mist" aria-hidden="true"><i></i><i></i></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="grain" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>
  <div class="bar top" aria-hidden="true"></div>
  <div class="bar bottom" aria-hidden="true"></div>

  <main>
    <!-- Inicio -->
    <section id="start" class="screen active">
      <h1>LA TRILLA</h1>
      <p class="subtitle">El precio de una decisión</p>
      <p class="tagline">Todo tiene su precio. Hasta el respeto.</p>
      <button id="btn-start" class="btn" type="button"><span>Comenzar</span></button>
    </section>

    <!-- Historia -->
    <section id="game" class="screen">
      <header id="hud">
        <p id="chapter"></p>
        <div id="clues" aria-label="Indicios reunidos">
          <span class="clue-label">Indicios</span>
          <span class="pips"><i></i><i></i><i></i></span>
        </div>
      </header>

      <div id="stage" data-who="narra">
        <p id="speaker"></p>
        <p id="text" aria-live="polite"></p>
      </div>

      <div id="choices"></div>
      <button id="btn-next" class="next" type="button" hidden>Continuar</button>
    </section>

    <!-- Final -->
    <section id="end" class="screen">
      <p id="end-tag" class="step"></p>
      <h2 id="end-title" class="step"></h2>
      <p id="end-quote" class="step"></p>
      <p id="end-closing" class="step"></p>
      <p id="end-voice" class="step">Todos creen que elegir es decidir lo que quieren. Pero pocas veces se detienen a pensar qué están dispuestos a perder.</p>
      <p id="end-question" class="step">¿Y usted qué habría hecho?</p>
      <div class="end-buttons step">
        <button id="btn-restart" class="btn" type="button"><span>Volver a comenzar</span></button>
        <button id="btn-home" class="btn ghost" type="button"><span>Volver al inicio</span></button>
      </div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Velo de transición: fundidos, tarjetas de capítulo, transición del pacto y de los finales -->
  <div id="veil" aria-hidden="true">
    <div class="veil-card"><p class="vc-n"></p><h2 class="vc-t"></h2></div>
    <p class="veil-phrase"></p>
  </div>

  <noscript><p style="position:fixed;inset:0;padding:2rem;color:#F5F2F0;background:#1A1918">Esta experiencia necesita JavaScript.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
